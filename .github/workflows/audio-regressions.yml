name: Audio regressions

# Every check here corresponds to a bug that shipped once. Running them on each change is
# what stops the same one coming back.
#
# The dependency stack is built from source, which is slow, so it is cached on the pinned
# revisions in other/build_dv_atmos_deps.sh. A change to those revisions rebuilds it.
#
# Checks that need a real DAC cannot run on a hosted runner: they take exclusive control of
# a device and reprogram its stream format. Run other/run_hardware_checks.sh on the machine
# the DAC is attached to before releasing anything that touches audio output.

on:
  push:
    branches: [ooyang0325-dolby-vision-atmos-research]
  pull_request:
    branches: [develop, ooyang0325-dolby-vision-atmos-research]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and check
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install --quiet meson ninja pkg-config nasm libass luajit uchardet \
            libarchive libbluray little-cms2 dav1d libsoxr rubberband libopenmpt \
            jpeg-xl libssh libdvdnav libdvdread libiconv

      # Keyed on the pinned revisions and on the sources compiled into the SACD bridge, so
      # moving any of them rebuilds rather than silently testing the old stack.
      - name: Cache dependency stack
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: |
            deps/build/prefix
            deps/build/src
            deps/lib
            deps/include
          key: deps-${{ runner.os }}-${{ hashFiles('other/build_dv_atmos_deps.sh', 'other/sacd_bridge.cpp', 'other/sacd_bridge.h') }}

      - name: Build dependency stack
        run: other/build_dv_atmos_deps.sh

      # Asserts the decoders, filters and protocols the player depends on are compiled in,
      # runs the SACD image parser against a synthetic Scarlet Book image, and checks that
      # DST can hand back raw DSD. build_dv_atmos_deps.sh runs the last two itself as it
      # goes; run_checks.sh repeats them so a cache hit still exercises them.
      - name: Run checks
        run: other/run_checks.sh

      - name: Download yt-dlp
        run: |
          mkdir -p deps/executable
          curl --fail --location --retry 3 \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos \
            --output deps/executable/youtube-dl
          chmod +x deps/executable/youtube-dl

      - name: Build IINA
        run: |
          xcodebuild -project iina.xcodeproj -scheme iina -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/IINA-DerivedData" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build -quiet

      - name: Package IINA
        id: package
        run: |
          app="$RUNNER_TEMP/IINA-DerivedData/Build/Products/Release/IINA.app"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$app/Contents/Info.plist")
          archive="IINA-${version}-Dolby-arm64.zip"
          # Ad-hoc signature: no Team ID, cannot be notarized, and Gatekeeper will
          # reject this on any machine that downloads it. It is enough to keep the
          # bundle internally consistent for local use and nothing more, so do not
          # describe the artifact as "signed" anywhere it is published.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          shasum -a 256 "$archive" > "${archive}.sha256"
          {
            echo "This build is **ad-hoc signed only**: no Developer ID, not notarized."
            echo "macOS Gatekeeper will refuse to open it until you clear the quarantine"
            echo "attribute yourself:"
            echo
            echo "    xattr -dr com.apple.quarantine /path/to/IINA.app"
          } > GATEKEEPER.txt
          echo "name=IINA-${version}-Dolby-arm64" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload IINA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
            GATEKEEPER.txt
          compression-level: 0

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: deps/build/src/mpv/build/meson-logs/
          if-no-files-found: ignore
